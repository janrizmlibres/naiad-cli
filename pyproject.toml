[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naiad"
version = "0.1.0"
description = "Drives a multi-phase Claude Code workflow to completion"
requires-python = ">=3.11"

[project.scripts]
naiad = "naiad.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.11"]

[tool.setuptools.packages.find]
include = ["naiad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
