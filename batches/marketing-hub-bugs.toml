# Two Marketing Hub bugs, both starting at the diagnosing State.
#
# Both are known bugs, so neither goes through `classify` — the operator has
# already made the judgement that State exists to make.
#
# Both pin `base` to develop rather than leaving it unsaid. An Entry with no
# pinned base stands on the Working branch of the nearest preceding Entry for
# the same repository, which would put #9660 on top of #9692's branch. These
# two are independent, so each names develop and the agent's ancestry test
# resolves it to develop.

workflow = "workflows/matt-pocock.toml"
repo = "~/dev/hcgps-monorepo"
at = "diagnose"
base = "develop"

[[entries]]
branch = "MC-AGENT-9692"
task = "See issue #9692"

[[entries]]
branch = "MC-AGENT-9660"
task = "See issue #9660"
