# Prompt conventions, this file's model choices, and where each State's shape
# was decided: docs/workflow-authoring.md

name = "matt-pocock"

# Every State, however a Run enters this file — an Entry may name the State it
# starts at, and a batch of known bugs starts at `diagnose`.

[answerer]
model = "opus"
effort = "medium"
fallback = "sonnet"

[[states]]
name = "classify"
model = "opus"
effort = "medium"
next = ["grill", "diagnose"]
prompt = """
Decide what kind of work the following task is, then announce where it starts.

{task}

Read as much of the codebase as you need to answer that one question. The criterion is what the task asks of the repository. If it asks for behaviour the repository does not have yet, or for behaviour it has to change on purpose, it is a feature: announce grill. If it reports the repository already doing something other than what it intends, it is a bug: announce diagnose. A task that describes a symptom rather than an outcome is a bug.

Say in a sentence which it is and why, then announce grill or diagnose.
"""

[[states]]
name = "diagnose"
model = "opus"
effort = "medium"
clear = true
next = ["no-repro", "pull-request"]
prompt = """
/diagnosing-bugs {task}

Before you change anything, put this Run on its own branch.

Working branch: {branch}
Predecessor: {predecessor}

If the Working branch line above is empty, none was given and the name is yours to derive: read this repository's own conventions — the recent branch names, the pull request list, the team's prefixes — and derive a name the team would have chosen, falling back to `feat/`, `fix/` or `chore/` plus a short slug of the task where no convention is discernible. Use that name wherever these instructions say the Working branch, and in the same turn you create the branch, declare it to Naiad — `naiad branch <name>` — which cannot know a name it was never told.

If the Working branch already exists, check it out as it is and leave it alone — a resumed or re-entered Run finds the branch waiting for it, which is ordinary rather than a failure.

If it does not exist, choose what to base it on before you create it, then create it from that branch by name — `git checkout -b {branch} <the branch you chose>` — rather than from whatever is currently checked out, which belongs to whichever Run was here last. Choose like this. When no Predecessor is named above, base it on this repository's base branch. Otherwise run `git merge-base --is-ancestor <predecessor> <base branch>`, in that order: a non-zero exit says the Predecessor is not yet an ancestor of the base branch, so its work has not landed and this Run stands on it — base the new branch on the Predecessor. A zero exit says it has landed — base the new branch on the base branch.

If the task above, or an issue it links to, names an image — a screenshot of the failure, a stack-trace grab, a broken screen — fetch it with `gh` or this repository's GitHub MCP server and Read it before you form a hypothesis, since a fault you can see is not one to reconstruct from prose.

Do not stop at the diagnosis. Implement the fix immediately.

If you cannot build a feedback loop at all, do not hypothesise without one: say so in the session, list what you tried and what you need, and announce no-repro. Otherwise, when the fix is in place, announce pull-request.
"""

[[states]]
name = "no-repro"
next = ["pull-request"]

[[states]]
name = "grill"
model = "opus"
effort = "medium"
clear = true
prompt = """
/grill-with-docs {task}

Before you change anything, put this Run on its own branch.

Working branch: {branch}
Predecessor: {predecessor}

If the Working branch line above is empty, none was given and the name is yours to derive: read this repository's own conventions — the recent branch names, the pull request list, the team's prefixes — and derive a name the team would have chosen, falling back to `feat/`, `fix/` or `chore/` plus a short slug of the task where no convention is discernible. Use that name wherever these instructions say the Working branch, and in the same turn you create the branch, declare it to Naiad — `naiad branch <name>` — which cannot know a name it was never told.

If the Working branch already exists, check it out as it is and leave it alone — a resumed or re-entered Run finds the branch waiting for it, which is ordinary rather than a failure.

If it does not exist, choose what to base it on before you create it, then create it from that branch by name — `git checkout -b {branch} <the branch you chose>` — rather than from whatever is currently checked out, which belongs to whichever Run was here last. Choose like this. When no Predecessor is named above, base it on this repository's base branch. Otherwise run `git merge-base --is-ancestor <predecessor> <base branch>`, in that order: a non-zero exit says the Predecessor is not yet an ancestor of the base branch, so its work has not landed and this Run stands on it — base the new branch on the Predecessor. A zero exit says it has landed — base the new branch on the base branch.

If the task above, or an issue it links to, names an image — a mockup to match, a screenshot of the behaviour in question — fetch it with `gh` or this repository's GitHub MCP server and Read it before the interview, since a design is grounded in what you can see rather than only what is described.

When the interview is finished and its ADRs and glossary entries are written, announce {next_state}.
"""

[[states]]
name = "review"
next = ["spec", "map-spec"]

[[states]]
name = "spec"
prompt = """
/to-spec

After writing the spec, announce {next_state}.
"""

[[states]]
name = "tickets"
next = ["orchestrate"]
prompt = """
/to-tickets

After writing the tickets, announce {next_state}, with no subject.
"""

[[states]]
name = "orchestrate"
model = "opus"
effort = "high"
clear = true
join = true
next = ["orchestrate", "implement", "triage", "handover", "pull-request"]
prompt = """
Working branch: {branch}
Predecessor: {predecessor}
Child limit: {child_limit}

Coordinate this feature's tickets. The tickets are the set this Run's task was split into, kept where this repository's issue tracker keeps them. A ticket or ticket set the task names is that set.

{task}

Work on the Working branch wherever it is checked out, and not on whatever this checkout stands on now: a person or another Run may have switched it. Run `git worktree list` before you change anything. If a worktree of this repository has the Working branch checked out, work and commit in that worktree. Otherwise, if the branch exists, check it out here. If the line names a branch that exists nowhere, do not create it from what is checked out — say so in the session and announce handover.

If the Working branch line above is empty, this Run was started here without one. Derive a name from this repository's conventions — its recent branch names, its pull requests, the team's prefixes — create it from the Predecessor when one is named above and `git merge-base --is-ancestor <predecessor> <base branch>` exits non-zero, and from the repository's base branch otherwise, never from what is checked out. Declare it to Naiad in the same turn with `naiad branch <name>`.

Work the tickets through these operations, each carried out the way this repository's issue tracker records it. Where an operation changes a file git tracks, commit it on the Working branch; otherwise there is nothing to commit.
- A ticket is closed when it was closed by completion or by decision, and open otherwise, claimed included.
- To claim a ticket is to mark it taken, so that no later pass hands it out again.
- To resolve a ticket is to mark it closed by completion, and nothing more.
- To comment on a ticket is to add a note to its history.
- A ticket's blocking edges are the tickets it names as blocking it, and they are satisfied when every one of them is closed.

A ticket's branch is `<working-branch>--<NN>`, where `<NN>` is its number, and its worktree is the sibling of this repository's checkout named `<repo>-wt-<working-branch-slug>--<NN>`: the checkout's directory name, `-wt-`, the Working branch with every `/` made `-`, then `--` and the number. A ticket's Child is in flight while the ticket is claimed, its worktree exists, and `naiad queue list` shows a Child of this Run working in that worktree.

The build limit, how many tickets may be built at once, is the smaller of the Child limit above and the `children` key of a .matt-pocock.toml at this repository's root. Either one absent sets no limit, and both absent means none at all. When the build limit is 1, nothing would run beside a Child, so spawn none: each ready ticket is handed in turn to implement, which builds it in this session on the Working branch. Otherwise each ready ticket is built by a Child of this Run, in a worktree of its own. Either way, build none of them yourself.

Do these three things, in order.

1. Take in each Child listed at the end of this step.

   A completed Child: merge its branch into the Working branch and run the tests. Where the ticket reached a companion repository — one the `companions` key of a .matt-pocock.toml at this repository's root names — merge the companion's branch of the same name into the companion's feature branch, which carries the Working branch's name, in whichever worktree of the companion has it checked out, creating it from the companion's base branch on first need. Resolve a merge conflict yourself and run the tests. If you cannot get them passing, abort the merge, say so in the session, and announce handover. Once its branches are merged and the tests pass, resolve its ticket; a Child leaves its ticket alone, so this is the only place it is resolved. If the resolve fails, the ticket stays claimed: say in the session which ticket it was. Then remove the Child's worktrees, here and in companions, and delete its branches with `git branch -d`.

   A cancelled Child: remove its worktree, keep its branch, and comment on its ticket that its Child was cancelled and its branch is kept. Its ticket stays claimed with no Child in flight.

   These are the Children that have finished since the last pass. When the list reads `- none`, there is nothing to take in: go on to step 2.

{children}

2. Scan the open, unclaimed tickets that carry the ready-for-agent label and whose blocking edges are all satisfied, lowest-numbered first.

   When the build limit is 1, claim nothing and spawn nothing: step 3 hands the next ticket on.

   Otherwise, for each of them, stopping once as many Children are in flight as the build limit allows:
   - claim it;
   - `git worktree add -b <working-branch>--<NN> <its worktree> <working-branch>`;
   - copy into that worktree the untracked setup the repository needs to build and test: its `.env` files, whatever its README names as a setup step, and whatever ticket files and spec the worktree would not otherwise have;
   - `naiad spawn --repo <its worktree> --branch <working-branch>--<NN> --base <working-branch> --at build --subject <the ticket's reference as the tracker names it, which for a ticket file is its path from the repository root>`. If the spawn is refused, remove that worktree and its branch, comment on the ticket giving the refusal, and leave it claimed with no Child in flight.

3. Route, by the first line that applies:
   - an open ticket whose blocking edges are all satisfied carries needs-triage — announce triage, passing that ticket's reference as the subject;
   - a Child is in flight — announce orchestrate, with no subject;
   - the build limit is 1 and an open, unclaimed ticket whose blocking edges are all satisfied carries ready-for-agent — announce implement, passing the lowest-numbered such ticket's reference as the subject;
   - an open ticket remains, whatever its label, including claimed with no Child in flight — announce handover, and say in the session which tickets and labels you found and why you are stopping, naming every ticket whose Child was cancelled;
   - no open ticket remains — announce pull-request.
"""

[[states]]
name = "triage"
model = "opus"
effort = "medium"
clear = true
next = ["orchestrate", "triage"]
prompt = """
/triage {subject}

Only give that ticket the needs-info label if there are questions that turn out not to be the repository's to answer, and a person says so.

End the pass with the ticket carrying ready-for-agent, ready-for-human, needs-info or wontfix.

Then choose what comes next. A ticket is closed when it was closed by completion or by decision, and open otherwise, claimed included. If an open ticket in the set whose blocking edges are all satisfied carries needs-triage, announce triage, passing the lowest-numbered such ticket's reference as the subject. Otherwise announce orchestrate, with no subject.
"""

[[states]]
name = "handover"
next = ["orchestrate", "triage", "pull-request"]

[[states]]
name = "pull-request"
model = "opus"
effort = "medium"
clear = true
prompt = """
Working branch: {branch}

Before anything else, sweep what the Children of the implement loop left behind, in this repository and in each companion repository described below: run `git worktree prune`, then delete with `git branch -d` every `{branch}--<NN>` branch already merged into `{branch}`.

Then work out which repositories this Run's work reached. This one, always, and in this one the Run's work is the Working branch above — not whatever this checkout stands on now, which a person or another Run may have switched while this Run worked. Run `git worktree list`: push and open from the worktree that has the Working branch checked out, or from this checkout if it stands on it. Ask the human before opening anything if the line above is empty, if no local branch has that name, or if the branch has commits ahead of its base that do not answer this Run's task.

A .matt-pocock.toml at this repository's root may also name companion repositories — a frontend to this backend, a client to this service — under a `companions` key, whose value is a list of paths to their checkouts relative to this repository's root. A feature that spans them leaves half its work in another checkout, so look at each one that key names — and not only at what that path has checked out. A path names a repository, and the work may sit in another worktree of it or on a branch nothing has checked out, while the path itself stands on something unrelated. So list every worktree (`git -C <path> worktree list`) and every local branch (`git -C <path> branch`) of that repository, and weigh each branch: it carries this Run's work if it is not the repository's base branch and has commits ahead of that base whose contents answer this Run's task. Push and open from the worktree that has that branch checked out. A companion none of whose branches carries such work — no such branch, or commits that are somebody else's unfinished work — is left untouched, and you say in the session which it was, which branches you weighed and why.

Where this repository's changes break what a companion reads — a renamed field, a removed endpoint, a changed response — and no companion branch carries the counterpart, that is not a follow-up to describe in a pull request body. Ask the human before opening anything.

Then take each of those repositories in turn, this one first, and decide for it alone whether it opens a pull request at all. It does not if it has no remote to open one against, or if a .matt-pocock.toml at its root says not to open one; say so in the session and go on to the next.

Otherwise, open a pull request there directly through the MCP server for that repository's host — GitHub, Gitea — pushing its branch first where the host does not have it yet, and taking the description from that branch compared against its base. Where this Run opens more than one, each body names the others, since half a change that only works whole is not a thing a reviewer should have to go looking for.

Predecessor: {predecessor}

Open this repository's own against the right base. When no Predecessor is named above, say nothing about a base and let it default to the repository's own. Otherwise run `git merge-base --is-ancestor <predecessor> <base branch>`, in that order, now — rather than relying on what was true when this Run started, because a Predecessor can land while a Run is working. A non-zero exit says the Predecessor still has not landed and this branch stands on it, so open it against the Predecessor as the base. A zero exit says it has landed, so say nothing about a base and let it default to the repository's own. A companion's pull request takes no Predecessor — a branch name here is not a fact about another repository — so say nothing about a base there either.

Once every one of them is settled, opened or deliberately not, announce {next_state}.
"""

[[states]]
name = "done"
terminal = true

# Entered only by name: `orchestrate` hands it one ticket at a time when its
# build limit is 1.

[[states]]
name = "implement"
model = "opus"
effort = "high"
next = ["orchestrate", "handover"]
prompt = """
/implement {subject}

Working branch: {branch}

Build that one ticket on the Working branch above, wherever it is checked out, and leave the other tickets alone. Run `git worktree list` before you change anything. If a worktree of this repository has the Working branch checked out, work and commit in that worktree. Otherwise check it out here.

If the ticket reaches a companion repository — one the `companions` key of a .matt-pocock.toml at this repository's root names — do that part on the companion's branch named the same as the Working branch, in whichever worktree of the companion has it checked out, creating it from the companion's base branch on first need.

When the ticket is done and its tests pass, commit on the Working branch and on any companion branch. Then resolve the ticket the way this repository's issue tracker records it, marking it closed by completion and nothing more, committing that on the Working branch only where it changes a file git tracks. Then announce orchestrate, with no subject.

If you cannot get its tests passing, leave the ticket as it is, say so in the session, and announce handover.
"""

# Entered only by name: each Child of `orchestrate` starts here.

[[states]]
name = "build"
model = "opus"
effort = "high"
next = ["done"]
prompt = """
/implement {subject}

Working branch: {branch}
Base: {predecessor}

Build that one ticket in this worktree, on the Working branch above, which was cut from the base branch. Leave the other tickets, the base branch and every other worktree alone, and push nothing.

Before you start the ticket, make this worktree buildable. Find the checkout that has the base branch checked out with `git worktree list`. Clone each dependency directory the repository's install creates and git does not track, such as `node_modules` or `.venv`, from that checkout into this one copy-on-write — `cp -c -R` on macOS, `cp -R --reflink=auto` on Linux — then run the repository's install. Where a clone still resolves the repository's own code from that checkout rather than this one, remove it and install fresh.

If the ticket reaches a companion repository — one the `companions` key of a .matt-pocock.toml at this repository's root names — do that part in a sibling worktree of the companion, named as this one is but after the companion's directory, on a branch named the same as the Working branch above. Cut that branch from the companion's branch named after the base branch, or from the companion's base branch when that branch does not exist yet.

Leave no watcher or dev server running. Run no test that needs a service the other tickets' worktrees share, such as a database, a port or a queue, unless this repository says they may share it.

When the ticket is done, commit on the Working branch and on any companion branch, and announce done. Leave the ticket itself as it is: the Parent resolves it once your branch is merged.
"""

# The Wayfinder loop. Entered only by name — `--at wayfind --subject <ticket>`
# or an Adoption — so it sits after the Terminal State, out of the declared
# order, and every State of it names its exits.

[[states]]
name = "wayfind"
model = "opus"
effort = "medium"
clear = true
questions = "human"
next = ["wayfind", "chart", "review"]
prompt = """
/wayfinder {subject}

Resolve that one ticket and no other in this pass, research included.

Then choose what comes next. A ticket is closed when its Status line reads resolved or wontfix, claimed when it reads claimed, and open otherwise. Scan the map's tickets for the lowest-numbered one that is open, unclaimed, and whose blocking edges are all satisfied, and read its Mode line:

- AFK — announce wayfind, passing that ticket's file as the subject.
- anything else, including HITL or no Mode line at all — announce chart, and say in the session which ticket and which Mode you found.
- no open tickets remain — announce review, passing the map file as the subject.
"""

[[states]]
name = "chart"
next = ["wayfind", "map-spec"]

[[states]]
name = "map-spec"
model = "opus"
effort = "medium"
clear = true
next = ["tickets"]
prompt = """
/to-spec {subject}

After writing the spec, announce {next_state}.
"""
