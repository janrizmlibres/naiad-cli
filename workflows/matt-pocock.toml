# The Matt Pocock feature chain, and the only Workflow that ships.
#
# Every Prompt opens with the slash command of the skill it runs: Claude Code
# reads a slash command only at the start of a message, so prose in front of it
# would send the skill's name as chat. What follows the command is the argument
# the human would have typed — which work, which input — and never a procedure:
# a skill's own logic stays in the skill, or it is maintained in two places.
#
# The Protocol is not restated in any Prompt. Naiad injects it into every fresh
# context, including the ones the Clearing States below create.

name = "matt-pocock"

# Kickoff. The only State told the task in words; everything after it reads the
# Artifacts this conversation and its successors leave behind.
[[states]]
name = "grill"
prompt = """
/grill-with-docs {task}

When the interview is finished and its ADRs and glossary entries are written, announce {next_state}.
"""

# The Gate State: no Prompt, so Naiad delivers nothing and waits. The human
# reads the ADRs and the glossary the interview produced and types into the
# session — approving, redirecting, or correcting in the one action.
[[states]]
name = "review"

# The spec and the tickets are synthesised from the grilling conversation, so
# neither Clears. These are the two phases that genuinely need what was said.
[[states]]
name = "spec"
prompt = """
/to-spec

When the spec is published to the tracker, announce {next_state}.
"""

[[states]]
name = "tickets"
prompt = """
/to-tickets

When every ticket is published with its blocking edges declared, announce {next_state}.
"""

# The loop: one State, Cleared and announced once per ticket. Naiad models no
# iteration and no exhaustion condition — which tickets remain is recorded in
# the ticket files, and the agent decides when it has run out. The loop's own
# name is written out because the interpolated successor is the State after the
# loop, which is the wrong thing to announce while tickets remain.
[[states]]
name = "implement"
clear = true
prompt = """
/implement the next ticket in the project's issue tracker that is ready to start, and only that one.

If tickets remain after it, announce implement again to take the next. If that was the last one, announce {next_state}.
"""

# Clears, though the PR skill prefers the session's context. What the loop
# leaves behind is one ticket's context rather than the branch's, so carrying it
# would describe the last ticket as though it were the whole pull request;
# Cleared, the skill compares the branch against its base and sees all of them.
#
# This State waits, which no other one does. The review the next State fixes is
# produced by Claude Code Review after the pull request opens, so announcing as
# soon as it is open would hand /fix-review an empty pull request. The wait has
# to happen inside the turn: an agent that stops without announcing is Nudged
# twice and then parks the Run, and no review arriving later would wake it.
#
# Three numbers are load-bearing and none of them is arbitrary (ADR 0006). The
# wait is one blocking command rather than a loop of checks, because a loop
# re-sends the accumulated context every time round and that is the whole cost.
# Ten minutes because that is the Bash tool's ceiling, so the budget the Prompt
# states and the cap the tool enforces are one number; the review itself takes
# about three, and the Run's outer bound is the hang rule's thirty. And the wait
# names the review check alone: the build checks on this repository run past
# fourteen minutes, so waiting on all of them would overrun for a reason that
# has nothing to do with the review.
[[states]]
name = "pull-request"
clear = true
prompt = """
/hcgps-pr

Once the pull request is open, wait for the Claude Code Review check to complete — that check alone, and not every check on the pull request, because the build checks run far longer than the review does. Wait in a single long-running command with a ten-minute timeout, rather than a loop of separate checks, and do not end your turn: nothing will wake you again if you stop. When the check has completed, read its findings from the pull request and announce {next_state}.

If no review check has completed after ten minutes, or this repository runs none, say so in the session and announce {next_state} anyway: there is then simply nothing to fix.
"""

# Names the pull request by its branch rather than as the one just opened: this
# Prompt arrives in a Cleared context, which remembers opening nothing.
#
# The empty case is named for the same reason. The State before this one
# announces it anyway when no review arrives inside its budget, and the Clear
# discards the context that heard it say so — so without this the State is told
# to fetch findings that are not there, and /fix-review, whose contract is that
# its findings are handed to it, is the State most likely to stop and ask.
[[states]]
name = "review-fix"
clear = true
prompt = """
/fix-review the Claude Code Review posted on the open pull request for this branch — fetch its findings from the pull request.

If the pull request carries no review findings, there is nothing to fix: say so and announce {next_state}.

When the review is addressed and pushed, announce {next_state}.
"""

# Terminal, and with no Prompt: the Run ends here rather than holding for a
# human, so it is not a Gate State.
[[states]]
name = "done"
terminal = true
